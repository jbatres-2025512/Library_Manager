spring.application.name=library-api
server.port=8081

# ---------- DataSource (credentials come from environment variables) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/db_library
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- HikariCP (tuned for ~500 concurrent requests with short transactions) ----------
spring.datasource.hikari.pool-name=LibraryPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:30}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000
# Bound row-lock waits (SELECT ... FOR UPDATE) so a stuck transaction cannot hang requests forever
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# ---------- JPA / Hibernate ----------
# Schema is managed by schema.sql (Phase 3); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------- SQL init (schema.sql / data.sql are added in Phase 3) ----------
spring.sql.init.mode=always

# ---------- Tomcat ----------
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:300}
server.tomcat.accept-count=200
server.tomcat.max-connections=10000

# ---------- JWT (used from Phase 6; no default on purpose) ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.university.library=INFO